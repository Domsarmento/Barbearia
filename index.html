<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dom Sarmento — Atalhos</title>
<style>
:root{
  --radius:18px;
  --text:#f6f7fb; --muted:#c8cbd8;

  /* fundo */
  --bg-dark:#0b0d11;

  /* navy brilhante dos botões/cards */
  --btn-top:#3f69be;     /* brilho no topo */
  --btn-mid:#224c99;     /* meio */
  --btn-bottom:#0f2d5a;  /* base */
  --btn-border:rgba(144,185,255,.45);
  --btn-gloss:rgba(255,255,255,.14);

  /* títulos / destaque */
  --accent-1:#f2b44b;
}

*{box-sizing:border-box} html,body{height:100%}
body{
  margin:0; color:var(--text);
  font:500 16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
  background:var(--bg-dark);
  overflow-x:hidden;
}

/* ===== CAMADAS DE FUNDO ===== */
.bg-img{
  position:fixed; inset:-8px; z-index:-2;
  background:center/cover no-repeat;
  filter: blur(14px) brightness(.8);    /* <<< desfoque forte */
  transform: scale(1.06);               /* evita borda do blur */
}
.bg-overlay{
  position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(1000px 600px at 10% -10%, rgba(15,45,90,.45), transparent 60%),
    radial-gradient(900px 550px at 110% 110%, rgba(34,76,153,.35), transparent 60%),
    linear-gradient(180deg, rgba(7,9,14,.50), rgba(7,9,14,.80));
}

/* ===== LAYOUT ===== */
.wrapper{min-height:100%; display:grid; grid-template-rows:auto 1fr auto;}
.container{max-width:980px; margin:0 auto; padding:24px 16px}

.header{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center}
.brand-logo{height:120px; width:auto}
.brand-title{font-weight:900; font-size:28px; letter-spacing:.3px}
.brand-sub{color:var(--muted); font-size:14px}
.big-legend{margin-top:6px; font-weight:900; letter-spacing:.4px; font-size:18px;
  color:color-mix(in oklab, var(--accent-1) 75%, #fff 25%); text-transform:uppercase}

/* ===== CARDS / BOTÕES: NAVY GLOSSY ===== */
.card, .action, .cta{
  background:
    linear-gradient(180deg, var(--btn-gloss), transparent 38%),
    linear-gradient(175deg, var(--btn-top), var(--btn-mid) 48%, var(--btn-bottom));
  border:1px solid var(--btn-border);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 12px 28px rgba(5,12,28,.35);
  border-radius:var(--radius);
}
.card{padding:16px 18px}
.card:active, .action:active, .cta:active{ transform:translateY(1px) }
.card, .action, .cta{ transition:transform .06s ease, border-color .2s ease }
.card:hover, .action:hover, .cta:hover{ border-color:rgba(170,205,255,.75) }

.cta{display:flex; align-items:center; gap:12px; padding:16px 18px; margin-top:10px}
.cta-icon{width:46px; height:46px; display:grid; place-items:center; border-radius:12px;
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04)); border:1px solid rgba(255,255,255,.22)}
.cta-title{font-weight:800; font-size:17px}

.actions{display:grid; gap:14px; margin-top:14px}
.action{display:flex; align-items:center; gap:12px; padding:16px 18px}
.action .icon{width:46px; height:46px; display:grid; place-items:center; border-radius:12px;
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04)); border:1px solid rgba(255,255,255,.22)}
.action .t1{font-weight:800; font-size:17px}
.action .t2{color:#e4e9ff; opacity:.8; font-size:13px; margin-top:2px}

/* ===== GALERIA ===== */
.gallery-pre{margin-top:26px; text-align:center; font-size:16px; font-weight:500}
.section{margin-top:16px}
.gallery-title{text-align:center; font-weight:800; font-size:18px; margin:6px 0 12px}
.carousel{position:relative}
.car-viewport{
  width:100%; aspect-ratio:16/9; max-height:420px; margin:auto;
  overflow:hidden; border-radius:18px; border:1px solid rgba(200,220,255,.25);
  background:rgba(10,14,20,.65);
  box-shadow:0 12px 28px rgba(5,12,28,.35);
}
@media (max-width:520px){ .car-viewport{ aspect-ratio:4/3; max-height:360px } }
.car-track{display:flex; height:100%; transition:transform .45s ease}
.car-slide{min-width:100%; height:100%}
.car-slide img{
  width:100%; height:100%;
  object-fit:cover;              /* preenche sem distorcer nem “explodir” */
  object-position:center;
}
.car-arrow{
  position:absolute; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border-radius:999px;
  border:1px solid rgba(200,220,255,.35);
  background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.08));
  color:#fff; font-size:22px; display:grid; place-items:center; cursor:pointer;
}

.footer{color:#ced6f3; font-size:12px; text-align:center; padding:22px 0 32px}

/* Desktop */
@media (min-width:800px){
  .brand-logo{height:160px}
  .brand-title{font-size:32px}
}
</style>
</head>
<body>
  <!-- FUNDO: imagem desfocada + overlay -->
  <div class="bg-img" id="bgLayer"></div>
  <div class="bg-overlay"></div>

  <div class="wrapper">
    <div class="container">
      <header class="header">
        <img id="brandLogo" class="brand-logo" alt="Logo">
        <div class="brand-title" id="brandName">Dom Sarmento</div>
        <div class="brand-sub" id="brandSub">Barbearia • Centro</div>
        <div class="big-legend" id="bigLegend">TRADIÇÃO E ESTILO EM CADA CORTE</div>
      </header>

      <section class="card">
        <div style="font-weight:800; font-size:18px; margin-bottom:10px" id="heroTitle">
          Agende, avalie e fale com a gente em um clique.
        </div>
        <a class="cta" id="btnAgendar" href="#">
          <div class="cta-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 2v3M17 2v3M3 10h18M4 6h16a1 1 0 0 1 1 1v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="cta-title" id="heroCtaText">Agendar horário</div>
        </a>
      </section>

      <div class="actions" id="actions"></div>

      <div class="gallery-pre" id="galleryTitleLegend">
        MAIS QUE CORTES, UMA EXPERIÊNCIA DOM SARMENTO
      </div>

      <section class="section">
        <div class="gallery-title">Galeria</div>
        <div class="carousel" id="galeria">
          <button class="car-arrow prev" aria-label="Anterior">‹</button>
          <div class="car-viewport">
            <div class="car-track" id="carTrack"></div>
          </div>
          <button class="car-arrow next" aria-label="Próximo">›</button>
        </div>
      </section>
    </div>

    <footer class="footer" id="footer">Dom Sarmento © 2025 • @domsarmento</footer>
  </div>

<script>
/* ===== CONFIG (ajuste os caminhos se usar outros nomes) ===== */
const CONFIG = {
  backgroundImage: "./background-dom-sarmento.jpg",
  logo: "./logo-dom-sarmento.png",
  brandName: "Dom Sarmento",
  brandSub: "Barbearia • Centro",
  bigLegend: "TRADIÇÃO E ESTILO EM CADA CORTE",
  heroTitle: "Agende, avalie e fale com a gente em um clique.",
  heroCta: { label: "Agendar horário" },
  footer: "Dom Sarmento © 2025 • @domsarmento",
  wifi: { password: "91011070" },
  actions: [
    { icon:"wifi", kind:"wifi",  title:"Conectar ao Wi-Fi",     desc:"Internet liberada para clientes", url:"#"},
    { icon:"star",             title:"Avaliações no Google", desc:"Conte como foi a sua experiência", url:"https://g.page/r/SEU_ID/review" },
    { icon:"ig",               title:"Instagram oficial",    desc:"@domsarmento", url:"https://instagram.com/domsarmento" },
    { icon:"wa",               title:"WhatsApp",             desc:"Fale direto com recepção", url:"https://wa.me/5549991746304" },
    { icon:"pix", kind:"copy", title:"Pagamento via PIX",    desc:"@domsarmento", url:"javascript:void(0)", copy:"49991746304" }
  ],
  gallery: [
    "./assets/galeria/media%3Agaleria1.jpg",
    "./assets/galeria/media%3Agaleria2.jpg",
    "./assets/galeria/media%3Agaleria3.jpg",
    "./assets/galeria/media%3Agaleria4.jpg"
  ]
};

/* ===== ÍCONES ===== */
const icons = {
  wifi:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M2 8c5.5-4.5 14.5-4.5 20 0M5 11c3.8-3 10.2-3 14 0M8.5 14.5c2-1.6 5-1.6 7 0M12 20h0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  star:`<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="m12 17.27 6.18 3.73-1.64-7.03L21 9.24l-7.19-.61L12 2 10.19 8.63 3 9.24l4.46 4.73L5.82 21z"/></svg>`,
  ig:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></svg>`,
  wa:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 19l1.2-4A8 8 0 1 1 20 12a8 8 0 0 1-11 7l-5 0z" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 9.5c0 4 3.5 6 5 6 .5 0 1.5-.5 1.5-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  pix:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M8 4 4 8l4 4 4-4L8 4Zm4 4 4-4 4 4-4 4-4-4Zm-4 4-4 4 4 4 4-4-4-4Zm4 4 4-4 4 4-4 4-4-4Z" stroke="currentColor" stroke-width="1.4"/></svg>`
};

/* Plataforma */
const ua = navigator.userAgent || navigator.vendor || window.opera;
const isAndroid = /Android/i.test(ua);
const isIOS = /iPhone|iPad|iPod/i.test(ua);

/* Helpers */
function openAndroidWifiSettings(){ try{ location.href='intent:#Intent;action=android.settings.WIFI_SETTINGS;end'; }catch(e){} }
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast';
    Object.assign(el.style,{position:'fixed',left:'50%',bottom:'22px',transform:'translateX(-50%)',
      padding:'10px 14px',borderRadius:'10px',fontSize:'14px',background:'rgba(0,0,0,.88)',color:'#fff',zIndex:'9999'});
    document.body.appendChild(el);
  }
  el.textContent=msg; el.style.opacity='1'; setTimeout(()=>el.style.opacity='0',1600);
}

/* Render */
(function(){
  // fundo (desfocado)
  if (CONFIG.backgroundImage){
    const bg = document.getElementById('bgLayer');
    bg.style.backgroundImage = `url('${CONFIG.backgroundImage}')`;
  }

  // header
  brandLogo.src = CONFIG.logo;
  brandName.textContent = CONFIG.brandName;
  brandSub.textContent  = CONFIG.brandSub;
  bigLegend.textContent = CONFIG.bigLegend;
  heroTitle.textContent = CONFIG.heroTitle;
  heroCtaText.textContent = CONFIG.heroCta?.label || 'Agendar horário';
  footer.textContent = CONFIG.footer;

  // CTA agendar
  btnAgendar.addEventListener('click', e=>{
    e.preventDefault();
    const ANDROID='https://play.google.com/store/apps/details?id=br.com.starapp.appbarbercli';
    const IOS='https://apps.apple.com/br/app/appbarber-cliente/id6450795073';
    const WEB='https://sistema.appbarber.com.br/login.php';
    if (isAndroid) location.href=ANDROID; else if (isIOS) location.href=IOS; else location.href=WEB;
  });

  // ações
  const wrap=document.getElementById('actions'); wrap.innerHTML='';
  CONFIG.actions.forEach(a=>{
    const link=document.createElement('a');
    link.className='action';
    link.href=a.url||'javascript:void(0)'; if(a.url?.startsWith('http')){link.target='_blank'; link.rel='noopener'}
    link.innerHTML=`<div class="icon">${icons[a.icon]||''}</div>
                    <div style="display:grid"><div class="t1">${a.title}</div>${a.desc?`<div class="t2">${a.desc}</div>`:''}</div>`;
    wrap.appendChild(link);

    if(a.kind==='wifi'){
      link.addEventListener('click', async ev=>{
        ev.preventDefault();
        try{ await navigator.clipboard.writeText(CONFIG.wifi?.password||''); }catch(e){}
        toast('Senha do Wi-Fi copiada'); if(isAndroid) openAndroidWifiSettings();
      });
    }
    if(a.kind==='copy' && a.copy){
      link.addEventListener('click', async ev=>{
        ev.preventDefault();
        try{ await navigator.clipboard.writeText(a.copy); }catch(e){}
        toast('Chave PIX copiada');
      });
    }
  });

  // galeria
  const track=document.getElementById('carTrack');
  track.innerHTML=(CONFIG.gallery||[]).map((src,i)=>`<div class="car-slide"><img src="${src}" alt="Galeria ${i+1}" loading="lazy"></div>`).join('');
  initCarousel('galeria', 4200);
})();

/* Carrossel */
function initCarousel(rootId, intervalMs=4200){
  const root=document.getElementById(rootId); if(!root) return;
  const track=root.querySelector('.car-track');
  const slides=[...root.querySelectorAll('.car-slide')];
  const prev=root.querySelector('.prev'), next=root.querySelector('.next');
  let i=0, timer, paused=false;
  const go=n=>{ i=(n+slides.length)%slides.length; track.style.transform=`translateX(${-i*100}%)`; };
  const start=()=>{ stop(); timer=setInterval(()=>{ if(!paused) go(i+1); }, intervalMs); };
  const stop =()=>{ if(timer) clearInterval(timer); };
  prev.addEventListener('click', ()=>{ go(i-1); start(); });
  next.addEventListener('click', ()=>{ go(i+1); start(); });
  root.addEventListener('mouseenter', ()=> paused=true);
  root.addEventListener('mouseleave', ()=> paused=false);
  root.addEventListener('touchstart', ()=> paused=true, {passive:true});
  root.addEventListener('touchend', ()=> paused=false);
  let sx=0,dx=0;
  root.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; }, {passive:true});
  root.addEventListener('touchmove',  e=>{ dx=e.touches[0].clientX - sx; }, {passive:true});
  root.addEventListener('touchend',   ()=>{ if(Math.abs(dx)>40){ dx<0?go(i+1):go(i-1); start(); } sx=dx=0; });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') stop(); else start(); });
  go(0); start();
}
</script>
</body>
</html>
